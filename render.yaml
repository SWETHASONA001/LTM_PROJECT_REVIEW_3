# Render Blueprint — one free web service (website + API) built from the Dockerfile.
# Render asks for the values marked `sync: false` when you create the Blueprint.
services:
  - type: web
    name: aerohydro-pinn
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: AEROHYDRO_SECRET          # signs sign-in sessions; generated once by Render
        generateValue: true
      - key: AEROHYDRO_ADMIN_EMAIL     # your sign-in email
        sync: false
      - key: AEROHYDRO_ADMIN_NAME      # your display name
        sync: false
      - key: AEROHYDRO_ADMIN_PASSWORD  # your password (min. 10 characters)
        sync: false
      - key: AEROHYDRO_USERS           # optional: JSON list of invited users
        sync: false
      - key: ANTHROPIC_API_KEY         # optional: enables the Claude copilot agent
        sync: false
